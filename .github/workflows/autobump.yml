# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 1:0 UTC
    - cron: 0 1 * * *

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Set up git
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          username: github-actions[bot]

      - name: Bump casks
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          updates=$(
            brew livecheck --cask --json --newer-only --full-name --tap="$TAP_NAME" |
              jq -r '
                .[] | select(.version.outdated == true) |
                [.cask, .version.latest] | @tsv
              '
          )
          [[ -n "$updates" ]] || exit 0

          while IFS=$'\t' read -r package version
          do
            cask_name="${package##*/}"
            brew bump-cask-pr --write-only --version="$version" "$package"
            git add -- "Casks/${cask_name}.rb"
            if ! git diff --cached --quiet; then
              git commit -m "build(${cask_name}): bump to ${version}"
            fi
          done <<< "$updates"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: main
